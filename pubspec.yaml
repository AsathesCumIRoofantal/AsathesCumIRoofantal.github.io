name: air_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  get: ^4.7.3
  intl: ^0.20.2
  flutter_native_splash: ^2.2.10+1
  scrollable_positioned_list: ^0.3.8
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^8.2.1
  flutter_animate: ^4.3.0
  # provider: ^6.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^3.0.0

  # Community + Social UX
  emoji_picker_flutter: ^4.4.0
  file_picker: ^12.1.1

  # agora_rtc_engine: ^6.6.3
  agora_rtc_engine: ^6.5.3 # running

  # livekit_client: ^2.7.0
  # livekit_client: ^1.5.0 #running

  flutter_webrtc: ^1.4.1
  web_socket_channel: ^3.0.3
  flutter_background: ^1.3.1
  flutter_screenutil: ^5.9.3
  responsive_builder: ^0.7.1

  web: ^1.0.0

  permission_handler: ^13.0.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  timeago: ^3.7.1

  sentry_flutter: ^9.21.0

  supabase_flutter: ^2.14.2
  provider: ^6.1.5+1


  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  universal_io: ^2.2.2
  universal_platform: ^1.1.0
  network_info_plus: ^8.2.1

  geolocator: ^14.0.3
  geocoding: ^5.0.0

  http: ^1.4.0
  collection: ^1.18.0
  
  speech_to_text: ^7.0.0   

  # ── Added for native remote-control input injection (this pass) ──────
  # Windows: SendInput via FFI, no native code needed.
  win32: ^6.4.0
  ffi: ^2.1.3

  # ── Added for local screen recording (this pass) ──────────────────────
  path_provider: ^2.1.4         # where to save the recorded file

  # js_util: 0.2.0
  js_interop: ^0.0.1

  
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  # flutter_webrtc: ^0.10.4 # for agora
  # dart_webrtc: ^1.3.1 # for agora
  # Alternatively: Switch Override to Git (If version conflicts occur)
  # flutter_webrtc:
  #   git:
  #     url: https://github.com/flutter-webrtc/flutter-webrtc
  #     ref: main

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/AIR_Icon.png"
  web:
    generate: true
    image_path: "assets/images/AIR_Icon_Web.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  min_sdk_android: 21
  remove_alpha_ios: true # android min sdk min:16, default 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/air_splash_logo.png
  # branding: assets/images/webPinoBrand.png
  color_dark: "#121212"
  image_dark: assets/images/air_splash_logo.png
  # branding_dark: assets/images/webPinoBrand.png
  # fill: true

  android_12:
    image: assets/images/air_splash_logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/air_splash_logo.png
    icon_background_color_dark: "#121212"
    # fill: true

  web: true
  image_web: assets/images/air_splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
